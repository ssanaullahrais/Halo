<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halo · Recording annotations</title></head><body><canvas id="annotationCanvas"></canvas><textarea id="annotationText" hidden maxlength="500" aria-label="Annotation text" placeholder="Type here…" rows="1"></textarea><button id="removeAnnotation" aria-label="Remove this annotation" hidden></button><div id="annotationTools"><div class="annotation-tool-group"><button data-tool="cursor" aria-label="Cursor"></button><button data-tool="arrow" aria-label="Arrow"></button><button data-tool="pencil" aria-label="Pencil"></button><button data-tool="ellipse" aria-label="Circle"></button><button data-tool="rectangle" aria-label="Rectangle"></button><button data-tool="text" aria-label="Text"></button><button data-tool="blur" aria-label="Blur"></button><button data-tool="eraser" aria-label="Erase individual annotations"></button></div><span class="annotation-divider"></span><div class="annotation-colour"><input id="annotationColour" type="hidden" value="#2563eb"><button id="annotationColourToggle" aria-label="Drawing colour" aria-expanded="false" aria-controls="annotationColourPicker"></button></div><button id="annotationStroke" aria-label="Line thickness">3 px</button><span class="annotation-divider"></span><button id="undoAnnotation" aria-label="Undo last annotation"></button><button id="clearAnnotations" aria-label="Clear annotations"></button><button id="applyAnnotations" aria-label="Return to recording"></button></div><div id="annotationColourPicker" class="annotation-colour-picker" role="dialog" aria-label="Drawing colour" hidden></div><div id="annotationError" role="status" hidden></div><script type="module" src="/src/recorder-annotations.js"></script></body></html>
