[package]
name = "halo"
version = "0.3.3"
description = "Hold any file to open a radial wheel: compress, convert or resize it in place."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "ico"] }
webp = "0.3"
base64 = "0.22"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_Xps", "Win32_Media"] }
pdfium-render = "0.9.4"
resvg = "0.49.0"
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
imgref = "1.12.3"
rgb = "0.8.53"
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"
qrcode = { version = "0.14", default-features = false }
color_quant = "1"
png = "0.17"
flate2 = "1"
sha2 = "0.10"
pulldown-cmark = "0.13.5"
wasapi = "0.26"
hound = "3.5"
chrono = "0.4"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = "2"

[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true
